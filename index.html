
<script>
(() => {
"use strict";

const TOTAL = 722;
const stage = document.getElementById("stage");
const frame = document.getElementById("frame");
const loading = document.getElementById("loading");
const counter = document.getElementById("counter");
const autoBtn = document.getElementById("auto");

let index = 1;
let desired = 1;
let dragging = false;
let lastX = 0;
let accumulated = 0;
let timer = null;
let resumeTimer = null;
let rendering = false;

const cache = new Map();
const MAX_CACHE = 120;

function normalize(n) {
  return ((n - 1) % TOTAL + TOTAL) % TOTAL + 1;
}

function filename(n) {
  return "d_" + String(normalize(n)).padStart(3, "0") + ".jpg";
}

function loadImage(n) {
  n = normalize(n);

  if (cache.has(n)) return cache.get(n);

  const img = new Image();
  const item = { img, ready: false, failed: false };

  img.onload = () => { item.ready = true; };
  img.onerror = () => { item.failed = true; };

  img.src = filename(n);
  cache.set(n, item);

  if (cache.size > MAX_CACHE) {
    for (const [key] of cache) {
      if (key !== index && key !== desired) {
        cache.delete(key);
        if (cache.size <= MAX_CACHE) break;
      }
    }
  }

  return item;
}

function render() {
  rendering = false;
  const item = loadImage(desired);

  if (item.ready) {
    index = desired;
    frame.src = item.img.src;
    counter.textContent = "الصورة " + index + " / " + TOTAL;
    loading.style.display = "none";
  } else if (item.failed) {
    loading.textContent = "تعذر تحميل الصورة " + desired;
    loading.style.display = "grid";
  }
}

function requestRender() {
  if (!rendering) {
    rendering = true;
    requestAnimationFrame(render);
  }
}

function show(n) {
  desired = normalize(n);
  const item = loadImage(desired);

  if (item.ready) {
    requestRender();
  } else if (!item.failed) {
    item.img.addEventListener("load", requestRender, { once: true });
  }
}

function preloadAround(n) {
  for (let i = 1; i <= 12; i++) {
    loadImage(n + i);
    loadImage(n - i);
  }
}

function step(amount) {
  show(desired + amount);
  preloadAround(desired);
}

function stopAuto() {
  if (timer) clearInterval(timer);
  timer = null;
  autoBtn.textContent = "⟳ دوران تلقائي";
}

function startAuto() {
  clearTimeout(resumeTimer);
  if (timer || dragging) return;

  timer = setInterval(() => {
    if (!document.hidden) step(1);
  }, 100);

  autoBtn.textContent = "إيقاف الدوران";
}

function scheduleResume() {
  clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => {
    if (!dragging) startAuto();
  }, 2000);
}

stage.addEventListener("pointerdown", e => {
  dragging = true;
  lastX = e.clientX;
  accumulated = 0;

  clearTimeout(resumeTimer);
  stopAuto();

  stage.setPointerCapture(e.pointerId);
});

stage.addEventListener("pointermove", e => {
  if (!dragging) return;

  accumulated += e.clientX - lastX;
  lastX = e.clientX;

  const steps = Math.trunc(accumulated / 12);

  if (steps !== 0) {
    accumulated -= steps * 12;
    step(-steps);
  }
});

function endDrag() {
  if (!dragging) return;
  dragging = false;
  scheduleResume();
}

stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("lostpointercapture", endDrag);

document.getElementById("left").onclick = () => {
  stopAuto();
  step(-1);
  scheduleResume();
};

document.getElementById("right").onclick = () => {
  stopAuto();
  step(1);
  scheduleResume();
};

autoBtn.onclick = () => {
  clearTimeout(resumeTimer);

  if (timer) {
    stopAuto();
  } else {
    startAuto();
  }
};

frame.addEventListener("load", () => {
  loading.style.display = "none";
});

frame.addEventListener("error", () => {
  loading.textContent = "تعذر تحميل الصورة الأولى";
});

loadImage(1);
preloadAround(1);
show(1);

// يبدأ الدوران تلقائياً عند فتح الصفحة
startAuto();

})();
</script>
