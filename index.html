
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIRAT | 360° Viewer</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fa;color:#172638}
.viewer{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.panel{width:min(100%,1100px);background:white;border-radius:22px;padding:clamp(14px,3vw,28px);box-shadow:0 15px 50px #17263815;text-align:center}
h1{margin:0 0 8px;font-size:clamp(25px,4vw,42px)}
.subtitle{color:#66788a;margin-bottom:16px}
.stage{position:relative;width:100%;aspect-ratio:1.6;background:#fff;border-radius:16px;overflow:hidden;cursor:grab;touch-action:none;user-select:none}
.stage:active{cursor:grabbing}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:#ffffffdf;font-weight:bold;z-index:2}
.hint{font-size:14px;color:#64748b;margin:15px 0}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{border:1px solid #d9e1eb;background:white;padding:12px 20px;border-radius:10px;cursor:pointer;font-weight:bold}
button:hover{background:#f0f5fa}
.counter{font-size:13px;color:#64748b;margin-top:15px}
@media(max-width:600px){.viewer{padding:8px}.panel{padding:12px;border-radius:14px}.stage{aspect-ratio:1.15}.controls button{padding:11px 13px}}
</style>
</head>
<body>
<main class="viewer">
<section class="panel">
<h1>FIRAT 360°</h1>
<div class="subtitle">استكشف فرن الدهان من جميع الزوايا</div>

<div class="stage" id="stage">
<img id="frame" src="d_001.jpg" alt="FIRAT Spray Booth" draggable="false">
<div class="loading" id="loading">جاري تجهيز العرض...</div>
</div>

<p class="hint">اسحب يمين ويسار لتدوير الفرن</p>

<div class="controls">
<button id="left">◀ يسار</button>
<button id="auto">⟳ دوران تلقائي</button>
<button id="right">يمين ▶</button>
</div>

<div class="counter" id="counter">الصورة 1 / 722</div>
</section>
</main>

<script>
(() => {
"use strict";

const TOTAL = 722;
const stage = document.getElementById("stage");
const frame = document.getElementById("frame");
const loading = document.getElementById("loading");
const counter = document.getElementById("counter");
const autoBtn = document.getElementById("auto");

let index = 1;
let desired = 1;
let dragging = false;
let lastX = 0;
let accumulated = 0;
let timer = null;
let rendering = false;

const cache = new Map();
const MAX_CACHE = 120;

function normalize(n) {
  return ((n - 1 + TOTAL * 1000) % TOTAL) + 1;
}

function filename(n) {
  return "d_" + String(normalize(n)).padStart(3, "0") + ".jpg";
}

function loadImage(n) {
  n = normalize(n);

  if (cache.has(n)) {
    return cache.get(n);
  }

  const img = new Image();
  const item = { img, ready: false, failed: false };

  img.onload = () => { item.ready = true; };
  img.onerror = () => { item.failed = true; };

  img.src = filename(n);
  cache.set(n, item);

  if (cache.size > MAX_CACHE) {
    for (const [key] of cache) {
      if (key !== index && key !== desired) {
        cache.delete(key);
        if (cache.size <= MAX_CACHE) break;
      }
    }
  }

  return item;
}

function render() {
  rendering = false;
  const item = loadImage(desired);

  if (item.ready) {
    index = desired;
    frame.src = item.img.src;
    counter.textContent = "الصورة " + index + " / " + TOTAL;
    loading.style.display = "none";
  } else if (item.failed) {
    loading.textContent = "تعذر تحميل الصورة " + desired;
    loading.style.display = "grid";
  }
}

function requestRender() {
  if (!rendering) {
    rendering = true;
    requestAnimationFrame(render);
  }
}

function show(n) {
  desired = normalize(n);
  const item = loadImage(desired);

  if (item.ready) {
    requestRender();
  } else if (!item.failed) {
    item.img.addEventListener("load", requestRender, { once: true });
  }
}

function preloadAround(n) {
  for (let i = 1; i <= 12; i++) {
    loadImage(n + i);
    loadImage(n - i);
  }
}

function step(amount) {
  show(desired + amount);
  preloadAround(desired);
}

function stopAuto() {
  if (timer) clearInterval(timer);
  timer = null;
  autoBtn.textContent = "⟳ دوران تلقائي";
}

stage.addEventListener("pointerdown", e => {
  dragging = true;
  lastX = e.clientX;
  accumulated = 0;
  stage.setPointerCapture(e.pointerId);
  stopAuto();
});

stage.addEventListener("pointermove", e => {
  if (!dragging) return;

  accumulated += e.clientX - lastX;
  lastX = e.clientX;

  const steps = Math.trunc(accumulated / 12);

  if (steps !== 0) {
    accumulated -= steps * 12;
    step(-steps);
  }
});

stage.addEventListener("pointerup", () => {
  dragging = false;
});

stage.addEventListener("pointercancel", () => {
  dragging = false;
});

document.getElementById("left").onclick = () => {
  stopAuto();
  step(-1);
};

document.getElementById("right").onclick = () => {
  stopAuto();
  step(1);
};

autoBtn.onclick = () => {
  if (timer) {
    stopAuto();
    return;
  }

  timer = setInterval(() => {
    step(1);
  }, 100);

  autoBtn.textContent = "إيقاف الدوران";
};

frame.addEventListener("load", () => {
  loading.style.display = "none";
});

frame.addEventListener("error", () => {
  loading.textContent = "تعذر تحميل الصورة الأولى";
});

loadImage(1);
preloadAround(1);
show(1);
})();
</script>
</body>
</html>
