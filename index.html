
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIRAT | Interactive 360°</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  overflow:hidden;
  background:transparent!important;
}

body{
  font-family:Arial,sans-serif;
}

.viewer{
  position:relative;
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  background:transparent;
  overflow:hidden;
}

.stage{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  cursor:grab;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;
}

.stage:active{
  cursor:grabbing;
}

.stage img{
  position:absolute;
  inset:0;
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  object-position:center;
  pointer-events:none;
  user-select:none;
  -webkit-user-drag:none;
}

.loading{
  position:absolute;
  left:50%;
  bottom:12%;
  transform:translateX(-50%);
  padding:9px 15px;
  border-radius:30px;
  background:#102d46d9;
  color:#fff;
  font-size:12px;
  text-align:center;
  white-space:nowrap;
  z-index:2;
}

.loading[hidden]{
  display:none!important;
}

@media(max-width:600px){
  .loading{
    bottom:8%;
    font-size:11px;
  }
}
</style>
</head>

<body>

<main class="viewer">
  <div
    class="stage"
    id="stage"
    aria-label="عارض فرن FIRAT تفاعلي 360 درجة"
  >
    <img
      id="frame"
      src="d_001.jpg"
      alt="فرن دهان FIRAT"
      draggable="false"
      fetchpriority="high"
    >

    <div class="loading" id="loading">
      جاري تجهيز العرض...
    </div>
  </div>
</main>

<script>
(() => {
  "use strict";

  const TOTAL = 722;

  // سرعة الدوران التلقائي
  const AUTO_SPEED = 100;

  // الرجوع للدوران بعد ترك الفرن
  const RESUME_DELAY = 2000;

  // حساسية السحب
  const DRAG_SENSITIVITY = 12;

  // التحميل المسبق
  const PRELOAD_AHEAD = 35;
  const PRELOAD_BEHIND = 8;
  const MAX_CONCURRENT = 4;

  const stage = document.getElementById("stage");
  const frame = document.getElementById("frame");
  const loading = document.getElementById("loading");

  let current = 1;
  let desired = 1;

  let dragging = false;
  let lastX = 0;
  let accumulated = 0;

  let autoTimer = null;
  let resumeTimer = null;
  let pendingRender = false;

  const cache = new Map();
  const queue = [];
  const queued = new Set();

  let activeLoads = 0;

  function normalize(n){
    return ((n - 1) % TOTAL + TOTAL) % TOTAL + 1;
  }

  function filename(n){
    return "d_" +
      String(normalize(n)).padStart(3,"0") +
      ".jpg";
  }

  function pump(){
    while(activeLoads < MAX_CONCURRENT && queue.length){

      const n = queue.shift();
      queued.delete(n);

      const item = cache.get(n);

      if(!item || item.state !== "queued"){
        continue;
      }

      item.state = "loading";
      activeLoads++;

      const img = new Image();
      item.img = img;

      img.onload = () => {
        item.state = "ready";
        activeLoads--;

        requestRender();
        pump();
      };

      img.onerror = () => {
        item.state = "failed";
        activeLoads--;
        pump();
      };

      img.src = filename(n);
    }
  }

  function requestImage(n, priority = false){
    n = normalize(n);

    let item = cache.get(n);

    if(item){
      if(priority && item.state === "queued"){
        const pos = queue.indexOf(n);

        if(pos !== -1){
          queue.splice(pos,1);
          queue.unshift(n);
        }
      }

      return item;
    }

    item = {
      state:"queued",
      img:null
    };

    cache.set(n,item);

    if(!queued.has(n)){
      if(priority){
        queue.unshift(n);
      }else{
        queue.push(n);
      }

      queued.add(n);
    }

    pump();
    return item;
  }

  function requestRender(){
    if(pendingRender) return;

    pendingRender = true;
    requestAnimationFrame(render);
  }

  function render(){
    pendingRender = false;

    const item = cache.get(desired);

    if(item && item.state === "ready"){
      current = desired;

      if(frame.src !== item.img.src){
        frame.src = item.img.src;
      }

      loading.hidden = true;
    }
  }

  function preloadAround(n){
    for(let i = 1; i <= PRELOAD_AHEAD; i++){
      requestImage(n + i);
    }

    for(let i = 1; i <= PRELOAD_BEHIND; i++){
      requestImage(n - i);
    }
  }

  function show(n){
    desired = normalize(n);

    requestImage(desired,true);
    preloadAround(desired);
    requestRender();
  }

  function step(amount){
    show(desired + amount);
  }

  function stopAuto(){
    if(autoTimer !== null){
      clearInterval(autoTimer);
      autoTimer = null;
    }
  }

  function startAuto(){
    clearTimeout(resumeTimer);

    if(dragging || autoTimer !== null){
      return;
    }

    autoTimer = setInterval(() => {
      if(document.hidden) return;

      const next = normalize(current + 1);
      const item = requestImage(next,true);

      preloadAround(current);

      if(item.state === "ready"){
        desired = next;
        requestRender();
      }

    }, AUTO_SPEED);
  }

  function scheduleResume(){
    clearTimeout(resumeTimer);

    resumeTimer = setTimeout(() => {
      if(!dragging){
        desired = current;
        startAuto();
      }
    }, RESUME_DELAY);
  }

  stage.addEventListener("pointerdown", e => {
    if(dragging) return;

    dragging = true;
    lastX = e.clientX;
    accumulated = 0;

    clearTimeout(resumeTimer);
    stopAuto();

    stage.setPointerCapture(e.pointerId);
  });

  stage.addEventListener("pointermove", e => {
    if(!dragging) return;

    accumulated += e.clientX - lastX;
    lastX = e.clientX;

    const steps = Math.trunc(
      accumulated / DRAG_SENSITIVITY
    );

    if(steps !== 0){
      accumulated -= steps * DRAG_SENSITIVITY;
      step(-steps);
    }
  });

  function endDrag(){
    if(!dragging) return;

    dragging = false;
    scheduleResume();
  }

  stage.addEventListener("pointerup",endDrag);
  stage.addEventListener("pointercancel",endDrag);
  stage.addEventListener("lostpointercapture",endDrag);

  frame.addEventListener("load", () => {
    loading.hidden = true;
  });

  frame.addEventListener("error", () => {
    loading.textContent = "تعذر تحميل صورة الفرن";
    loading.hidden = false;
  });

  document.addEventListener("visibilitychange", () => {
    if(document.hidden){
      stopAuto();
      clearTimeout(resumeTimer);
    }else if(!dragging){
      desired = current;
      startAuto();
    }
  });

  // تجهيز العرض
  requestImage(1,true);
  preloadAround(1);
  show(1);

  // دوران تلقائي
  startAuto();

})();
</script>

</body>
</html>
